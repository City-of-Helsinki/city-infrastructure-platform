{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ language_code }}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0" />
        <title>{% trans "Maintenance Mode" %}</title>
        <link rel="stylesheet"
              href="{% static 'cityinfra/css/status_page.css' %}" />
    </head>
    <body>
        <div class="container">
            <div class="icon"
                 aria-hidden="true">🔧</div>
            <h1>{% trans "Maintenance Mode" %}</h1>
            <div class="message message--preserve-whitespace">{{ message }}</div>
            <div class="info">{% trans "We apologize for the inconvenience. Please check back soon." %}</div>
        </div>
    </body>
</html>
