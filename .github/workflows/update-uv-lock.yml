# .github/workflows/update-uv-lock.yml
name: Update uv.lock on release-please PRs

on:
  push:
    branches:
      - 'release-please--**'

jobs:
  update-uv-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # release 6.0.2 (2026-01-09)
        with:
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # release 8.0.0 (2026-03-26)
        with:
          version: "0.12.1" # 2026-07-31
          # checksum for Linux x64: https://github.com/astral-sh/uv/releases/tag/0.12.1
          checksum: "90b2f223fb69d19db49e117da601f64978593417988530aa733d456141b4bcbb"

      - name: Update uv.lock
        run: uv lock

      - name: Commit updated uv.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet uv.lock; then
            echo "uv.lock is already up to date, no commit needed"
          else
            git add uv.lock
            git commit -m "chore: update uv.lock for release"
            git push
          fi
