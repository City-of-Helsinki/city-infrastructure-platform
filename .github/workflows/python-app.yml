name: City Infrastructure Platform tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Backend CI using the City-of-Helsinki template Django backend CI template with uv
  backend:
    name: Django API CI
    uses: City-of-Helsinki/.github/.github/workflows/ci-uv-django-api.yml@main
    with:
      python-version: "3.12"
      postgres-major-version: 17
      use-postgis: true
      # Run the openapi schema validations as an extra command before the tests
      extra-commands: "./scripts/check-open-api-schema.sh"
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Custom frontend CI - at the moment we don't have a frontend CI template with yarn
  map-view:
    name: Map View CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up NodeJS 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # release 6.4.0 (2026-04-20)
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install NodeJS dependencies
        run: |
          corepack enable
          YARN_ENABLE_SCRIPTS=false yarn --cwd map-view install --immutable --immutable-cache --check-cache

      - name: Run NodeJS code neatness tests
        run: |
          yarn --cwd map-view prettier
          yarn --cwd map-view lint
          yarn --cwd map-view validate-ts

      - name: Run NodeJS build
        run: |
          yarn --cwd map-view build

      - name: Run NodeJS code functionality tests
        run: |
          yarn --cwd map-view test:ci
