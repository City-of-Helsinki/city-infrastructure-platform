name: City Infrastructure Platform tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Pre-commit behavior that that matches the current repo rules
  pre-commit-custom:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Run pre-commit
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      with:
        extra_args: >-
          --show-diff-on-failure
          --from-ref ${{ github.event.before }}
          --to-ref ${{ github.sha }}

  # Backend CI using the City-of-Helsinki template Django backend CI template with uv
  backend:
    name: Django API CI
    needs: pre-commit-custom # Use a more lenient pre-commit hook for the time being
    uses: City-of-Helsinki/.github/.github/workflows/ci-uv-django-api.yml@main
    with:
      python-version: "3.12"
      postgres-major-version: 17
      use-postgis: true
      # The current template pre-commit is too aggressive with its rules and parsing too many files
      skip-pre-commit: true
      # Run the openapi schema validations as an extra command before the tests
      extra-commands: |
        echo "OIDC_AUTHENTICATION_ENABLED=0" >> $GITHUB_ENV
        echo "DEBUG=1" >> $GITHUB_ENV
        OIDC_AUTHENTICATION_ENABLED=0 DEBUG=1 ./scripts/check-open-api-schema.sh
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Custom frontend CI - at the moment we don't have a frontend CI template with yarn
  map-view:
    name: Map View CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up NodeJS 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # release 6.4.0 (2026-04-20)
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install NodeJS dependencies
        run: |
          corepack enable
          YARN_ENABLE_SCRIPTS=false yarn --cwd map-view install --immutable --immutable-cache --check-cache

      - name: Run NodeJS code neatness tests
        run: |
          yarn --cwd map-view prettier
          yarn --cwd map-view lint
          yarn --cwd map-view validate-ts

      - name: Run NodeJS build
        run: |
          yarn --cwd map-view build

      - name: Run NodeJS code functionality tests
        run: |
          yarn --cwd map-view test:ci
